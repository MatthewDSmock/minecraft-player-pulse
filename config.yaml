# Minecraft Player Pulse — scraper configuration
# Edit this to expand subreddits, pillar keyword sets, or scrape volume.

subreddits:
  - Minecraft
  - MinecraftMarketplace
  - minecraftsuggestions
  - MinecraftMemes  # for cultural temperature
  - admincraft      # for server/realm power-user perspective

# Pillar classification is keyword-based. A record can match multiple pillars.
# Keep keywords specific — generic terms like "money" or "expensive" go in a
# separate sentiment-modifier list rather than here.
pillar_keywords:
  Marketplace:
    # Original Reddit / Mojang vocabulary
    - marketplace
    - skin pack
    - skinpack
    - mash-up
    - mash up
    - mashup pack
    - texture pack
    - world template
    - adventure map
    - minecoin
    - minecoins
    - mojang creator
    - paid content
    - bedrock store
    - in-game store
    - in game store
    # Mobile / App Store vocabulary
    - in-app purchase
    - in app purchase
    - iap
    - microtransaction
    - microtransactions
    - micro transaction
    - micro-transaction
    - pay to play
    - pay-to-play
    - pay to win
    - pay-to-win
    - money grab
    - cash grab
    - greedy
    - rip off
    - rip-off
    - ripoff
    - too expensive
    - overpriced
    - free trial
    - premium version
    - paid version
    - my child bought
    - my child spent
    - my kid bought
    - my kid spent
    - my son bought
    - my son spent
    - my daughter bought
    - my daughter spent
    - spent money
    - spent real money
    - wasted money
    - wasted my money
    - refund
    - refunded
    # Steam / paid-title vocabulary
    - dlc
    - season pass
    - hero pass
    - battle pass
    - expansion pack
    - content drop
    - deluxe edition
    - ultimate edition
    - season 1
    - season 2
    - season 3
    - season 4
    - season 5
    - season 6
    - cosmetic
    - cosmetics
    - skins cost
    - buy skins
    - buy a skin

  Realms:
    # Single-word base — App Store and casual community language uses these
    # more often than the formal multi-word terms
    - realm
    - realms
    # Original Reddit / Mojang vocabulary
    - realms plus
    - realm plus
    - realms server
    - realm server
    - realms subscription
    - realm subscription
    - player cap
    - player limit
    - friends server
    - private server
    - realm host
    - 10 player
    - 10-player
    - realms renewal
    # Mobile-specific subscription vocabulary
    - monthly subscription
    - subscription cost
    - cancel subscription
    - auto renew
    - auto-renew
    - auto renewal
    - auto-renewal
    - automatic renewal
    - forgot to cancel
    - charged me again
    - hidden subscription
    # General multiplayer / Realms-adjacent terms
    - join my server
    - my server
    - server hosting
    - host a server
    - dedicated server
    - online server
    - more players
    - bigger server
    - 20 players
    - 50 players
    - 100 players

  CreatorOnDemand:
    - creator program
    - partner program
    - creator earnings
    - creator payout
    - creator revenue
    - publisher partner
    - waypoint studios
    - noxcrew
    - blockworks
    - mojang partner
    - creator dashboard
    - hire a builder
    - hire a creator
    - commission a build
    - made to order
    - custom map
    - custom skin
    - custom build
    - paid builder
    - freelance builder

scrape_limits:
  posts_per_subreddit: 500       # newest posts to consider per subreddit per run
  comments_per_post: 200         # top-level comments to fetch per post

storage:
  output_dir: data/raw           # one timestamped parquet per run (audit trail)
  master_file: data/processed/minecraft_sentiment.parquet
